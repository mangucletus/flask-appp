version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/flask-app

permissions:
  - object: /home/ubuntu/flask-app
    owner: ubuntu
    group: ubuntu

hooks:
  ApplicationStop:
    - location: deploy/stop.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: deploy/install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: deploy/start.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: deploy/validate.sh
      timeout: 60
      runas: root
