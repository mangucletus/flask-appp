name: Deploy to AWS

on:
  push:
    branches: [main]

# OIDC token is needed so this workflow can assume the AWS IAM role below.
permissions:
  id-token: write
  contents: read

# Pipeline config — set these in GitHub repo settings:
#   Secrets:   AWS_ROLE_ARN
#   Variables: AWS_REGION, S3_BUCKET, CODEDEPLOY_APP, CODEDEPLOY_GROUP
# See README.md ("CI/CD setup") for step-by-step instructions.
env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  CODEDEPLOY_APP: ${{ vars.CODEDEPLOY_APP }}
  CODEDEPLOY_GROUP: ${{ vars.CODEDEPLOY_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (for tests)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # Replace with real tests; for the demo we just verify the module imports.
        run: |
          python -c "import app; print('App imports OK')"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # TEMP for OIDC debugging — revert to ${{ secrets.AWS_ROLE_ARN }} after verifying
          role-to-assume: arn:aws:iam::003100375237:role/GitHubActionsDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Package application
        run: |
          zip -r app-${{ github.sha }}.zip \
            app.py requirements.txt appspec.yml deploy/ templates/

      - name: Upload bundle to S3
        run: |
          aws s3 cp app-${{ github.sha }}.zip \
            s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.zip

      - name: Trigger CodeDeploy deployment
        run: |
          aws deploy create-deployment \
            --application-name ${{ env.CODEDEPLOY_APP }} \
            --deployment-group-name ${{ env.CODEDEPLOY_GROUP }} \
            --s3-location bucket=${{ env.S3_BUCKET }},key=app-${{ github.sha }}.zip,bundleType=zip